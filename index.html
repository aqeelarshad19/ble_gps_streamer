<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 LoRa GPS Streamer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            background-color: #dc3545;
        }
        .status-badge.connected { background-color: #28a745; }
        
        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        /* Terminal styling for incoming ESP32 messages */
        #terminal {
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            font-size: 13px;
        }
        .log-entry { margin-bottom: 4px; }
    </style>
</head>
<body>

    <h2>🛰️ LoRa Wardriver Controller</h2>
    
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span>BLE Status:</span>
            <span id="ble-status" class="status-badge">Disconnected</span>
        </div>
        <button id="connect-btn">Connect to ESP32</button>
    </div>

    <div class="card">
        <h3>📍 GPS Telemetry</h3>
        <div class="data-row">
            <span>Latitude:</span>
            <strong id="lat-display">--</strong>
        </div>
        <div class="data-row">
            <span>Longitude:</span>
            <strong id="lng-display">--</strong>
        </div>
        <div class="data-row">
            <span>Accuracy:</span>
            <strong id="acc-display">--</strong>
        </div>
        <p style="font-size: 12px; color: #aaa;">GPS updates are automatically pushed to ESP32 when connected.</p>
    </div>

    <div class="card">
        <h3>📡 ESP32 Live Stream</h3>
        <div id="terminal">
            <div style="color: #888;">// Waiting for connection...</div>
        </div>
    </div>

    <script>
        // Web Bluetooth UUIDs (Must be lowercase in JavaScript!)
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // Browser writes GPS here
        const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // ESP32 sends status here

        let bleDevice = null;
        let rxCharacteristic = null;
        let gpsWatchId = null;
        let lastGpsString = "NO_GPS_FIX";

        // UI Elements
        const connectBtn = document.getElementById('connect-btn');
        const bleStatus = document.getElementById('ble-status');
        const terminal = document.getElementById('terminal');

        // --- BLE Connection Logic ---
        connectBtn.addEventListener('click', async () => {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
                return;
            }

            try {
                logToTerminal("Requesting Bluetooth Device...");
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "ESP32-LoRa" }],
                    optionalServices: [SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                logToTerminal("Connecting to GATT Server...");
                const server = await bleDevice.gatt.connect();

                logToTerminal("Discovering Service...");
                const service = await server.getPrimaryService(SERVICE_UUID);

                // 1. Get RX for sending GPS to ESP32
                rxCharacteristic = await service.getCharacteristic(RX_UUID);
                
                // 2. Get TX for receiving status logs from ESP32
                const txCharacteristic = await service.getCharacteristic(TX_UUID);
                
                // Subscribe to notifications
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                updateStatus(true);
                logToTerminal("✅ Connected & Subscribed to telemetry!");

                // Start GPS tracking once connected
                startGpsTracking();

            } catch (error) {
                logToTerminal(`❌ Error: ${error}`);
                console.error(error);
            }
        });

        // --- Handle Incoming ESP32 Data ---
        function handleIncomingData(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            const message = decoder.decode(value);
            logToTerminal(message);
        }

        // --- GPS Tracking & Sending ---
        function startGpsTracking() {
            if (!navigator.geolocation) {
                logToTerminal("⚠️ Geolocation is not supported by your browser");
                return;
            }

            gpsWatchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    
                    document.getElementById('lat-display').innerText = lat;
                    document.getElementById('lng-display').innerText = lng;
                    document.getElementById('acc-display').innerText = `±${position.coords.accuracy.toFixed(1)}m`;

                    lastGpsString = `${lat},${lng}`;
                    sendGpsToESP32(lastGpsString);
                },
                (error) => {
                    logToTerminal(`⚠️ GPS Error: ${error.message}`);
                },
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        async function sendGpsToESP32(gpsData) {
            if (!rxCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(gpsData);
                await rxCharacteristic.writeValue(data);
                // logToTerminal(`Pushed GPS -> ${gpsData}`); // Optional: uncomment to see local GPS pushes
            } catch (error) {
                console.error("Write error:", error);
            }
        }

        // --- Utility Functions ---
        function onDisconnected() {
            updateStatus(false);
            logToTerminal("⚠️ Disconnected from ESP32");
            rxCharacteristic = null;
            if (gpsWatchId) {
                navigator.geolocation.clearWatch(gpsWatchId);
            }
        }

        function updateStatus(connected) {
            if (connected) {
                bleStatus.innerText = "Connected";
                bleStatus.classList.add("connected");
                connectBtn.innerText = "Disconnect";
                connectBtn.style.backgroundColor = "#dc3545";
            } else {
                bleStatus.innerText = "Disconnected";
                bleStatus.classList.remove("connected");
                connectBtn.innerText = "Connect to ESP32";
                connectBtn.style.backgroundColor = "#007bff";
            }
        }

        function logToTerminal(message) {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.textContent = `[${time}] ${message}`;
            terminal.appendChild(logEntry);
            
            // Auto-scroll to bottom
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
