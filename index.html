<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 LoRa GPS Streamer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            background-color: #dc3545;
        }
        .status-badge.connected { background-color: #28a745; }
        
        .data-row {
            display: flex; justify-content: space-between;
            margin: 10px 0; padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        #terminal {
            background-color: #000; color: #00ff00;
            font-family: monospace; height: 250px;
            overflow-y: auto; padding: 10px;
            border-radius: 5px; border: 1px solid #333;
            font-size: 13px; margin-top: 10px;
        }
        .log-entry { margin-bottom: 4px; }
        
        /* OTA Styles */
        #ota-progress { width: 100%; height: 20px; margin-top: 10px; display: none; }
        input[type="file"] { margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <h2>🛰️ LoRa Wardriver Controller</h2>
    
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span>BLE Status:</span>
            <span id="ble-status" class="status-badge">Disconnected</span>
        </div>
        <button id="connect-btn">Connect to ESP32</button>
    </div>

    <div class="card">
        <h3>📍 GPS Telemetry</h3>
        <div class="data-row"><span>Latitude:</span><strong id="lat-display">--</strong></div>
        <div class="data-row"><span>Longitude:</span><strong id="lng-display">--</strong></div>
        <p style="font-size: 12px; color: #aaa;">GPS updates are automatically pushed to ESP32 when connected.</p>
    </div>

    <!-- OTA UPDATE SECTION -->
    <div class="card">
        <h3>🔄 Firmware Update (OTA)</h3>
        <p style="font-size: 12px; color: #aaa;">Select the firmware.bin file generated by PlatformIO.</p>
        <input type="file" id="fw-file" accept=".bin" disabled />
        <button id="ota-btn" disabled>Start Update</button>
        <progress id="ota-progress" value="0" max="100"></progress>
        <div id="ota-status" style="font-size: 13px; margin-top: 5px; color: #ffcc00;"></div>
    </div>

    <div class="card">
        <h3>📡 ESP32 Live Stream</h3>
        <div id="terminal"><div style="color: #888;">// Waiting for connection...</div></div>
    </div>

    <script>
        // Telemetry UUIDs
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
        
        // OTA UUIDs
        const OTA_SERVICE_UUID = "8a8342f0-7b59-11ea-bc55-0242ac130003";
        const OTA_CTRL_UUID    = "8a8345a2-7b59-11ea-bc55-0242ac130003";
        const OTA_DATA_UUID    = "8a83478c-7b59-11ea-bc55-0242ac130003";

        let bleDevice = null;
        let rxCharacteristic = null;
        let otaCtrlCharacteristic = null;
        let otaDataCharacteristic = null;
        let gpsWatchId = null;

        const connectBtn = document.getElementById('connect-btn');
        const bleStatus = document.getElementById('ble-status');
        const terminal = document.getElementById('terminal');
        const fileInput = document.getElementById('fw-file');
        const otaBtn = document.getElementById('ota-btn');
        const otaProgress = document.getElementById('ota-progress');
        const otaStatus = document.getElementById('ota-status');

        // --- BLE Connection Logic ---
        connectBtn.addEventListener('click', async () => {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
                return;
            }

            try {
                logToTerminal("Requesting Bluetooth Device...");
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "ESP32-LoRa" }],
                    optionalServices: [SERVICE_UUID, OTA_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                const server = await bleDevice.gatt.connect();

                // 1. Setup Telemetry Service
                const teleService = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await teleService.getCharacteristic(RX_UUID);
                const txCharacteristic = await teleService.getCharacteristic(TX_UUID);
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                // 2. Setup OTA Service
                const otaService = await server.getPrimaryService(OTA_SERVICE_UUID);
                otaCtrlCharacteristic = await otaService.getCharacteristic(OTA_CTRL_UUID);
                otaDataCharacteristic = await otaService.getCharacteristic(OTA_DATA_UUID);

                updateStatus(true);
                logToTerminal("✅ Connected & Subscribed to telemetry!");
                startGpsTracking();

            } catch (error) {
                logToTerminal(`❌ Error: ${error}`);
                console.error(error);
            }
        });

        // --- OTA Update Logic ---
        otaBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Please select a .bin file first.");
            
            otaBtn.disabled = true;
            fileInput.disabled = true;
            otaProgress.style.display = 'block';
            otaStatus.innerText = "Reading file...";

            const arrayBuffer = await file.arrayBuffer();
            const firmware = new Uint8Array(arrayBuffer);
            const fileSize = firmware.length;
            
            // Chunk size of 200 bytes is safe for most BLE MTU negotiations
            const CHUNK_SIZE = 200; 
            const totalChunks = Math.ceil(fileSize / CHUNK_SIZE);

            try {
                otaStatus.innerText = `Preparing ESP32 (Size: ${fileSize} bytes)...`;
                
                // 1. Send START command with file size
                const encoder = new TextEncoder();
                await otaCtrlCharacteristic.writeValue(encoder.encode(`START:${fileSize}`));
                
                // Small delay to let ESP32 format flash
                await new Promise(resolve => setTimeout(resolve, 1000));

                otaStatus.innerText = "Flashing... Keep browser open and near device.";

                // 2. Send chunks sequentially
                for (let i = 0; i < totalChunks; i++) {
                    const start = i * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, fileSize);
                    const chunk = firmware.slice(start, end);

                    // Await guarantees flow control so we don't overwhelm the Bluetooth stack
                    await otaDataCharacteristic.writeValue(chunk);
                    
                    const progress = Math.round(((i + 1) / totalChunks) * 100);
                    otaProgress.value = progress;
                    
                    if (i % 10 === 0) { // Update text every 10 chunks to reduce UI lag
                        otaStatus.innerText = `Flashing: ${progress}%`;
                    }
                }

                // 3. Send END command
                otaStatus.innerText = "Verifying and Rebooting...";
                await otaCtrlCharacteristic.writeValue(encoder.encode("END"));
                otaStatus.innerText = "✅ Update Complete! ESP32 is rebooting.";
                
            } catch (error) {
                otaStatus.innerText = `❌ OTA Failed: ${error.message}`;
                logToTerminal(`OTA Error: ${error}`);
            }

            otaBtn.disabled = false;
            fileInput.disabled = false;
        });

        // --- Handle Incoming Logs ---
        function handleIncomingData(event) {
            const value = event.target.value;
            const message = new TextDecoder('utf-8').decode(value);
            logToTerminal(message);
        }

        // --- GPS Tracking ---
        function startGpsTracking() {
            if (!navigator.geolocation) return logToTerminal("⚠️ Geolocation not supported");
            gpsWatchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lng = pos.coords.longitude.toFixed(6);
                    document.getElementById('lat-display').innerText = lat;
                    document.getElementById('lng-display').innerText = lng;
                    
                    if(rxCharacteristic) {
                        const data = new TextEncoder().encode(`${lat},${lng}`);
                        rxCharacteristic.writeValue(data).catch(e => console.log(e));
                    }
                },
                (err) => logToTerminal(`⚠️ GPS Error: ${err.message}`),
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        // --- Utility Functions ---
        function onDisconnected() {
            updateStatus(false);
            logToTerminal("⚠️ Disconnected from ESP32");
            rxCharacteristic = null;
            otaCtrlCharacteristic = null;
            otaDataCharacteristic = null;
            if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
        }

        function updateStatus(connected) {
            if (connected) {
                bleStatus.innerText = "Connected";
                bleStatus.classList.add("connected");
                connectBtn.innerText = "Disconnect";
                connectBtn.style.backgroundColor = "#dc3545";
                fileInput.disabled = false;
                otaBtn.disabled = false;
            } else {
                bleStatus.innerText = "Disconnected";
                bleStatus.classList.remove("connected");
                connectBtn.innerText = "Connect to ESP32";
                connectBtn.style.backgroundColor = "#007bff";
                fileInput.disabled = true;
                otaBtn.disabled = true;
                otaProgress.style.display = 'none';
                otaStatus.innerText = '';
            }
        }

        function logToTerminal(message) {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.textContent = `[${time}] ${message}`;
            terminal.appendChild(logEntry);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
